[project]
name = "digikam-piwigo-exporter"
version = "0.1.0"
description = "Import DigiKam-managed albums into Piwigo through the Web API"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.28.0",
    "pillow>=11.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.14.0",
]

[project.scripts]
digikam-piwigo-import = "digikam_piwigo_exporter.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
