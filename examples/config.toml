[auth]
# Prefer PIWIGO_USERNAME / PIWIGO_PASSWORD or PIWIGO_API_KEY in the environment.
# username = "piwigo-user"
# password = "piwigo-password"
# Piwigo API key. Must include the pkid and secret separated by ':'.
# api_key = "pkid-XXXXXXXX-XXXXXXXXXXXX:YYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYY"

[piwigo]
# Piwigo privacy level. Leave unset to let Piwigo use its default.
# 0 = everybody, 1 = contacts, 2 = friends, 4 = family, 8 = admins
default_level = 0
# New albums created by this importer should be private or public.
created_album_status = "private"

[share_albums]
share-family = "Shared / Family"
share-friends = "Shared / Friends"
share-public = "Shared / Public"
